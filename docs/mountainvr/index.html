<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c1016">
<title>Ridgeline AR</title>
<style>
  :root {
    --bg: #0c1016; --panel: rgba(12, 16, 22, 0.78); --fg: #f2f4f7; --muted: #a9b3c1;
    --accent: #ffb020; --accent-fg: #1a1200; --line: rgba(255,255,255,0.14);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  body:not(.has-camera).running { background: linear-gradient(#2f5a86 0%, #7fa9cf 55%, #cfdde9 100%); }
  #camera { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  body.has-camera #camera { display: block; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

  #start { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow: auto;
    background: radial-gradient(120% 80% at 50% 110%, #2a3a52 0%, var(--bg) 60%); }
  .card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .ridge-art { width: 100%; height: 64px; margin: 4px 0 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.06); color: var(--fg); font-size: 15px; -webkit-user-select: text; user-select: text; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 600; }
  .primary { background: var(--accent); color: var(--accent-fg); width: 100%; margin-top: 18px; font-size: 16px; }
  .secondary { background: rgba(255,255,255,0.1); color: var(--fg); width: 100%; margin-top: 10px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
  .warn { color: #ffb4a8; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  #info { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px);
    display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #peak-name { font-weight: 700; font-size: 16px; color: var(--accent); }
  #peak-detail { font-size: 13px; margin-top: 2px; }
  #here { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #compass { text-align: right; min-width: 92px; }
  #heading { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  #pitch, #offset { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #controls { position: absolute; right: 12px; bottom: calc(var(--sab) + 86px); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  #controls button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 10px 12px; font-size: 13px; backdrop-filter: blur(6px); }
  #controls #btn-align { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  body.land #btn-align, body.mode-sim #btn-reset, body.no-sensor #btn-align, body.no-sensor #btn-reset,
  body.mode-sim #btn-mode, body.no-sensor #btn-mode { display: none; }
  body.land #camera { display: none !important; }
  #settings { position: absolute; left: 12px; right: 84px; bottom: calc(var(--sab) + 86px); pointer-events: auto; font-size: 13px; }
  #settings input[type=range] { padding: 0; accent-color: var(--accent); }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 14px; text-align: center; pointer-events: none; }
  #status.error { border-color: #ff6b5a; color: #ffd0c9; }
  #hint { position: absolute; left: 12px; bottom: calc(var(--sab) + 86px); font-size: 11px; color: var(--muted);
    max-width: calc(100% - 120px); text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<video id="camera" playsinline muted autoplay></video>
<canvas id="overlay"></canvas>

<section id="start">
  <div class="card">
    <h1>Ridgeline <span>AR</span></h1>
    <svg class="ridge-art" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 52 L40 44 L70 48 L110 34 L140 40 L175 22 L200 8 L222 20 L250 16 L280 32 L320 28 L360 42 L400 38"
        fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
      <path d="M140 40 L175 22 L200 8 L222 20 L250 16 L280 32" fill="none" stroke="#ffb020" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <p class="lead">現在地から見える範囲で一番高い山を標高データから探し、その稜線を表示します。VR では建物がなければ見えるはずの山並みを再現し、山頂に山名と標高を表示します（近い山は黒く、遠い山は霞んだグレー）。</p>
    <div class="row">
      <div><label for="in-radius">探索半径</label>
        <select id="in-radius">
          <option value="20000">20 km</option>
          <option value="40000" selected>40 km</option>
          <option value="80000">80 km</option>
          <option value="150000">150 km</option>
        </select></div>
      <div><label for="in-eye">目の高さ (m)</label><input id="in-eye" type="number" value="1.7" step="0.5" min="0" inputmode="decimal"></div>
    </div>
    <div class="row">
      <div><label for="in-lat">緯度 (空欄で GPS)</label><input id="in-lat" inputmode="decimal" placeholder="35.5000"></div>
      <div><label for="in-lon">経度</label><input id="in-lon" inputmode="decimal" placeholder="138.7600"></div>
    </div>
    <button class="primary" id="btn-vr">VR を開始（景色を再現）</button>
    <button class="secondary" id="btn-ar">AR を開始（カメラ映像に重ねる）</button>
    <button class="secondary" id="btn-sim">PC でシミュレーション (ドラッグで見回す)</button>
    <p class="note">位置情報・方位センサー（AR ではカメラも）へのアクセスを許可してください。山名は OpenStreetMap から取得します。コンパスは数度ずれることがあるので、表示後にドラッグするか「山頂に合わせる」で補正できます。</p>
    <p class="note warn" id="secure-warn" hidden>HTTPS で開いていないため、カメラとセンサーが使えません。</p>
  </div>
</section>

<div id="hud" hidden>
  <div id="info">
    <div class="pill">
      <div id="peak-name">計算中…</div>
      <div id="peak-detail"></div>
      <div id="here"></div>
    </div>
    <div class="pill" id="compass">
      <div id="heading">—</div>
      <div id="pitch"></div>
      <div id="offset"></div>
    </div>
  </div>
  <div id="hint">ドラッグ: 位置合わせ / ピンチ: 画角</div>
  <div class="pill" id="settings" hidden>
    <label for="in-fov">カメラ画角 (長辺)</label>
    <input id="in-fov" type="range" min="30" max="100" step="0.5" value="67">
  </div>
  <div id="controls">
    <button id="btn-align">山頂に合わせる</button>
    <button id="btn-reset">補正リセット</button>
    <button id="btn-mode">カメラ表示</button>
    <button id="btn-recalc">再計算</button>
    <button id="btn-settings">設定</button>
  </div>
</div>
<div id="status" hidden></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
