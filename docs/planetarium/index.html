<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Dome</title>
  <style>
    :root {
      --ink: #e8eef8; --dim: #9fb0c8; --panel: rgba(8, 14, 28, 0.72); --line: #33476a;
      --accent: #f2c46d; --on: #2c4f86;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
                 font: 14px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    #hud { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
           pointer-events: none; text-shadow: 0 0 6px #000; line-height: 1.5; font-variant-numeric: tabular-nums; }
    #clock { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
    #rateText { color: var(--accent); }
    #hud small { color: var(--dim); }
    #sensorMsg { color: var(--accent); font-size: 12px; max-width: min(92vw, 520px); }
    #sensorMsg:empty { display: none; }
    #hud a { color: var(--dim); pointer-events: auto; }
    #panel { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 8px;
             padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
             padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
             background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0)); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
    button, select, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                            border-radius: 10px; min-height: 38px; padding: 0 10px; }
    button { cursor: pointer; user-select: none; -webkit-user-select: none; }
    button[aria-pressed="true"] { background: var(--on); border-color: #6c93d0; }
    .navbtn { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; border-radius: 10px;
              border: 1px solid #8a6a2c; background: rgba(60, 40, 8, .7); color: var(--accent);
              font-weight: 600; text-decoration: none; white-space: nowrap; }
    .navbtn:active { background: rgba(120, 85, 20, .8); }
    .navbtn:focus-visible { outline: 2px solid #9cf; outline-offset: 1px; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #9cf; outline-offset: 1px; }
    #rates { gap: 4px; flex-wrap: nowrap; }
    #rates button { min-width: 0; padding: 0 7px; font-size: 12.5px; white-space: nowrap; }
    @media (max-width: 420px) { #rates button { padding: 0 5px; font-size: 11.5px; } }
    #custom { display: flex; gap: 6px; }
    #custom[hidden] { display: none; }
    #custom input { width: 92px; }
    #vrSlot > * { position: static !important; transform: none !important; left: auto !important; bottom: auto !important;
                  width: auto !important; padding: 0 12px !important; height: 38px; font: inherit !important; border-radius: 10px !important; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="clock"></div>
    <div><span id="rateText"></span> ・ <span id="place"></span></div>
    <div id="sunInfo"></div>
    <div id="sensorMsg"></div>
    <small>ドラッグ: 見回す / ホイール・ピンチ: ズーム / センサー: スマホを向けた方向の空<br>
    VR: トリガーで時間の速さを切り替え</small><br>
    <small>Star data: <a href="https://github.com/astronexus/HYG-Database">HYG Database</a> (CC BY-SA 4.0)</small>
  </div>

  <div id="panel">
    <div class="row" id="rates" role="group" aria-label="時間の進み方">
      <button id="now">今</button>
      <button data-rate="0">停止</button>
      <button data-rate="1">実時間</button>
      <button data-rate="60">1分/秒</button>
      <button data-rate="600">10分/秒</button>
      <button data-rate="3600">1時間/秒</button>
      <button data-rate="86400">1日/秒</button>
    </div>
    <div class="row">
      <button id="sunToggle" aria-pressed="true">太陽 ON</button>
      <button id="sensorToggle" aria-pressed="false">センサー</button>
      <button id="labelToggle" aria-pressed="true">名前</button>
      <a id="toFlight" class="navbtn" href="./flight.html">宇宙へ飛び立つ →</a>
      <select id="loc" aria-label="観測地">
        <option value="35.6812,139.7671">東京</option>
        <option value="43.0621,141.3544">札幌</option>
        <option value="34.6937,135.5023">大阪</option>
        <option value="33.5902,130.4017">福岡</option>
        <option value="26.2124,127.6809">那覇</option>
        <option value="19.8207,-155.4681">マウナケア</option>
        <option value="51.4769,-0.0005">グリニッジ</option>
        <option value="40.7128,-74.0060">ニューヨーク</option>
        <option value="-33.8688,151.2093">シドニー</option>
        <option value="90,0">北極点</option>
        <option value="here">現在地</option>
        <option value="custom">緯度経度を入力…</option>
      </select>
      <span id="custom" hidden>
        <input id="lat" type="number" step="0.0001" min="-90" max="90" aria-label="緯度" placeholder="緯度">
        <input id="lon" type="number" step="0.0001" min="-180" max="180" aria-label="経度" placeholder="経度">
      </span>
      <span id="vrSlot"></span>
    </div>
  </div>
  <script type="module" src="./planetarium.js"></script>
</body>
</html>
